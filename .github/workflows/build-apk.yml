# ArDroid — cloud APK build (GitHub Actions)
#
# Trigger manually from the Actions tab ("Run workflow"), then download the
# APK from the run's artifacts and install it on your phone.
#
# How it works:
#   1. Downloads a Podroid release APK and reuses its PREBUILT,
#      distro-agnostic components: kernel (vmlinuz-virt), initramfs
#      (initrd.img) and the QEMU native libraries. These are identical
#      between Podroid and ArDroid — only the guest rootfs changed.
#   2. Builds the Arch Linux ARM rootfs with Docker
#      (build-rootfs/Dockerfile.rootfs) -> arch-rootfs.squashfs,
#      UNLESS build-rootfs/ is unchanged since the last successful build —
#      then the squashfs is reused from that run's artifact (~15 min build).
#      box64 is cached as a prebuilt package (actions/cache) so the ~1.5h
#      AUR compile is skipped whenever the AUR HEAD hasn't changed.
#   3. Builds the Android APK with Gradle (debug, signed with the debug
#      key — installable directly on a phone).
#
# The full from-source build (kernel + QEMU + initramfs) is still
# available locally via ./build-all.sh all on a machine with Docker.

name: Build ArDroid APK (cloud)

on:
  workflow_dispatch:
    inputs:
      podroid_release:
        description: >-
          Podroid release tag to reuse the prebuilt kernel / initramfs /
          QEMU from (distro-agnostic, unchanged by the Arch port)
        required: false
        default: 'v1.2.9'

permissions:
  actions: read      # list workflow runs + download artifacts (rootfs reuse)
  contents: read     # checkout

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out ArDroid
        uses: actions/checkout@v4
        with:
          # Full history: the rootfs-reuse check diffs against the last
          # successful run's commit.
          fetch-depth: 0

      - name: Check if rootfs needs a rebuild
        id: rootfs-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH='${{ github.ref_name }}'
          REPO='${{ github.repository }}'
          RUN_ID='${{ github.run_id }}'
          API="https://api.github.com/repos/$REPO"
          AUTH=(-s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          # Last successful run of THIS workflow on this branch, excluding
          # the current run. Its head_sha is what we diff against.
          # curl is used instead of `gh` (the gh CLI proved unreliable here).
          # If the API call fails, fall back to a full rebuild (safe).
          API_RESP="$(curl "${AUTH[@]}" \
            "$API/actions/workflows/build-apk.yml/runs?branch=$BRANCH&status=success&per_page=10" \
            || true)"
          LAST_ID="$(echo "$API_RESP" | jq -r \
            --argjson rid "$RUN_ID" \
            '[.workflow_runs[] | select(.id != $rid)][0] | .id // empty')"
          LAST_SHA="$(echo "$API_RESP" | jq -r \
            --argjson rid "$RUN_ID" \
            '[.workflow_runs[] | select(.id != $rid)][0] | .head_sha // empty')"
          if [ -z "$LAST_ID" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "reason=no-previous-successful-run" >> "$GITHUB_OUTPUT"
            echo "No previous successful run (or API call failed) — full rebuild."
            exit 0
          fi
          # The squashfs must exist as an artifact on that run (runs from
          # before this optimization have only the APK artifact).
          ARTIFACT_ID="$(curl "${AUTH[@]}" \
            "$API/actions/runs/$LAST_ID/artifacts" \
            | jq -r '.artifacts[] | select(.name == "arch-rootfs-squashfs") | .id // empty' \
            | head -1 || true)"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "reason=no-reusable-squashfs-artifact" >> "$GITHUB_OUTPUT"
            echo "Run $LAST_ID has no squashfs artifact — full rebuild."
            exit 0
          fi
          # Rebuild only if the rootfs inputs changed: everything under
          # build-rootfs/ (build scripts, Dockerfile, systemd units,
          # helpers). Workflow-file changes alone do NOT invalidate the
          # rootfs — how the squashfs is built lives entirely in
          # build-rootfs/. Anything else (app code, docs, workflow)
          # reuses the previous squashfs.
          if git diff --quiet "$LAST_SHA" HEAD -- \
                build-rootfs/ 2>/dev/null; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "reuse_run_id=$LAST_ID" >> "$GITHUB_OUTPUT"
            echo "reason=rootfs-inputs-unchanged" >> "$GITHUB_OUTPUT"
            echo "Rootfs inputs unchanged since run $LAST_ID — reusing its squashfs."
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "reason=rootfs-inputs-changed" >> "$GITHUB_OUTPUT"
            echo "Rootfs inputs changed — full rebuild."
            git diff --name-only "$LAST_SHA" HEAD -- \
              build-rootfs/ | head -10
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # keep the Android SDK (we need it below)
          android: false

      - name: Set up QEMU (arm64 emulation for the rootfs build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Podroid release APK (prebuilt kernel/initramfs/QEMU)
        run: |
          set -euo pipefail
          TAG='${{ inputs.podroid_release }}'
          curl -sSL --retry 3 \
            -o /tmp/podroid-stock.apk \
            "https://github.com/ExTV/Podroid/releases/download/${TAG}/Podroid-${TAG}-release.apk"
          ls -la /tmp/podroid-stock.apk

      - name: Extract prebuilt kernel, initramfs and QEMU libs
        run: |
          set -euo pipefail
          rm -rf /tmp/prebuilt && mkdir -p /tmp/prebuilt
          cd /tmp/prebuilt
          # NOTE: libtermux.so is intentionally NOT extracted — the vendored
          # terminal-emulator module compiles it via AGP's NDK build.
          unzip -o -q /tmp/podroid-stock.apk \
            'assets/vmlinuz-virt' \
            'assets/initrd.img' \
            'assets/qemu/*' \
            'lib/arm64-v8a/libqemu-system-aarch64.so' \
            'lib/arm64-v8a/libslirp.so' \
            'lib/arm64-v8a/libpodroid-bridge.so' \
            'lib/arm64-v8a/libpodroid-launcher.so'
          ASSETS="$GITHUB_WORKSPACE/app/src/main/assets"
          JNILIBS="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$ASSETS" "$JNILIBS"
          cp assets/vmlinuz-virt assets/initrd.img "$ASSETS/"
          rm -rf "$ASSETS/qemu" && cp -r assets/qemu "$ASSETS/"
          cp lib/arm64-v8a/*.so "$JNILIBS/"
          echo '--- assets ---' && ls -la "$ASSETS"
          echo '--- jniLibs ---' && ls -la "$JNILIBS"

      # ── box64 package cache (skips the ~1.5h AUR compile) ───────────────
      - name: Get box64 AUR HEAD (cache key)
        id: box64-ver
        if: steps.rootfs-check.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          # NOTE: ls-remote can print multiple lines for HEAD (symref +
          # target); take the first line only, or GITHUB_OUTPUT gets a
          # bare-SHA line and rejects it ("Invalid format").
          SHA=$(git ls-remote https://aur.archlinux.org/box64.git HEAD \
                | head -1 | cut -f1 | tr -d '[:space:]')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "box64 AUR HEAD: $SHA"

      - name: Restore box64 package cache
        if: steps.rootfs-check.outputs.rebuild == 'true'
        uses: actions/cache@v4
        with:
          path: build-rootfs/box64-prebuilt.pkg.tar.zst
          # Keyed on the AUR HEAD: a new upstream box64 release misses the
          # cache and gets compiled once, then cached under the new key.
          key: box64-${{ steps.box64-ver.outputs.sha }}

      - name: Ensure box64 placeholder for Docker build
        if: steps.rootfs-check.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          # actions/cache only creates the file on a hit; the Dockerfile COPY
          # needs it to exist, so ensure an (empty) file on a miss.
          # build-rootfs.sh treats an empty/invalid file as "no cache".
          touch build-rootfs/box64-prebuilt.pkg.tar.zst
          ls -la build-rootfs/box64-prebuilt.pkg.tar.zst

      - name: Build Arch Linux ARM rootfs
        if: steps.rootfs-check.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          SYSVER=$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' \
            app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          echo "SYSTEM_VERSION=${SYSVER:-0}"
          OUT="$GITHUB_WORKSPACE/.rootfs-out"
          rm -rf "$OUT" && mkdir -p "$OUT"
          docker buildx build \
            -f build-rootfs/Dockerfile.rootfs \
            -t ardroid-rootfs:latest \
            --build-arg "SYSTEM_VERSION=${SYSVER:-0}" \
            --output "type=local,dest=$OUT" \
            build-rootfs/
          ls -la "$OUT"
          # Only the squashfs goes into the APK assets; the box64 package
          # feeds back into the actions/cache for the next build.
          cp "$OUT/arch-rootfs.squashfs" "$GITHUB_WORKSPACE/app/src/main/assets/"
          cp "$OUT/box64.pkg.tar.zst" \
             "$GITHUB_WORKSPACE/build-rootfs/box64-prebuilt.pkg.tar.zst"
          ls -la "$GITHUB_WORKSPACE/app/src/main/assets/arch-rootfs.squashfs"

      - name: Reuse previous rootfs squashfs
        if: steps.rootfs-check.outputs.rebuild == 'false'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.rootfs-check.outputs.reuse_run_id }}
          name: arch-rootfs-squashfs
          path: app/src/main/assets/

      - name: Verify rootfs squashfs present
        run: |
          set -euo pipefail
          ls -la "$GITHUB_WORKSPACE/app/src/main/assets/arch-rootfs.squashfs"
          test -s "$GITHUB_WORKSPACE/app/src/main/assets/arch-rootfs.squashfs"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTE: the action's default packages ("tools platform-tools")
          # fail because Google removed the legacy "tools" package;
          # platform-tools/platforms/NDK are installed explicitly below.
          packages: platform-tools

      - name: Install Android platform + NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Show APK info
        run: ls -la app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Always upload the squashfs so the NEXT run can reuse it when the
      # rootfs inputs haven't changed (keeps the reuse chain alive).
      - name: Upload rootfs squashfs (for future rebuild-skip)
        uses: actions/upload-artifact@v4
        with:
          name: arch-rootfs-squashfs
          path: app/src/main/assets/arch-rootfs.squashfs
          if-no-files-found: error
